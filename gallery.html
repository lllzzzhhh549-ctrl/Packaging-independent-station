<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品案例 — Vibrant Packaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      background:#09090b;color:#fff;
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;line-height:1.5;
    }
    a{color:inherit;text-decoration:none}

    /* ---------- Liquid glass ---------- */
    .lg{
      background:rgba(255,255,255,.01);background-blend-mode:luminosity;
      -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
      border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);
      position:relative;overflow:hidden;
    }
    .lg::before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
      background:linear-gradient(to bottom,
        rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,
        transparent 40%,transparent 60%,
        rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }

    /* ---------- Layout ---------- */
    .wrap{max-width:72rem;margin:0 auto}
    .px{padding-left:1.25rem;padding-right:1.25rem}
    @media(min-width:640px){.px{padding-left:2rem;padding-right:2rem}}
    @media(min-width:1024px){.px{padding-left:5rem;padding-right:5rem}}

    /* ---------- Nav ---------- */
    .nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:1.25rem 0;position:relative;z-index:20;
    }
    .brand{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:1.05rem;color:#fff}
    .brand b{font-weight:300;color:rgba(255,255,255,.7)}
    .back-btn{
      display:inline-flex;align-items:center;gap:.4rem;
      border-radius:9999px;padding:.55rem 1.2rem;
      font-size:.8rem;font-weight:500;color:rgba(255,255,255,.8);
      transition:background .3s ease;
    }
    .back-btn:hover{background:rgba(255,255,255,.08)}
    .icon{width:18px;height:18px;display:inline-block;vertical-align:middle}

    /* ---------- Header ---------- */
    .header{text-align:center;padding:3rem 0 1rem}
    @media(min-width:640px){.header{padding:4.5rem 0 1.5rem}}
    .eyebrow{
      font-size:.75rem;font-weight:500;text-transform:uppercase;
      letter-spacing:.2em;color:rgba(255,255,255,.4);margin-bottom:.75rem;
    }
    .h1{
      font-size:2rem;font-weight:400;letter-spacing:-.03em;color:#fff;
      line-height:1.12;
    }
    @media(min-width:640px){.h1{font-size:2.75rem}}
    @media(min-width:768px){.h1{font-size:3.25rem}}
    .sub{margin:.75rem auto 0;font-size:.9rem;font-weight:300;color:rgba(255,255,255,.6);max-width:36rem}

    /* ---------- Filter tabs ---------- */
    .filters{
      display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;
      padding:1.75rem 0 2.5rem;
    }
    .tab{
      border-radius:9999px;padding:.45rem 1.1rem;
      font-size:.78rem;font-weight:500;cursor:pointer;
      color:rgba(255,255,255,.55);transition:all .25s ease;
      background:transparent;border:1px solid transparent;
    }
    .tab:hover{color:rgba(255,255,255,.85)}
    .tab.active{
      color:#fff;background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.14);
    }

    /* ---------- Gallery grid ---------- */
    .gallery{
      display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;
      padding-bottom:4rem;
    }
    @media(min-width:520px){.gallery{grid-template-columns:repeat(3,1fr);gap:1rem}}
    @media(min-width:1024px){.gallery{grid-template-columns:repeat(4,1fr);gap:1.1rem}}

    .g-item{
      position:relative;border-radius:.85rem;overflow:hidden;
      cursor:pointer;background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.07);
      aspect-ratio:4/5;
      transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease;
    }
    .g-item:hover{
      transform:translateY(-4px) scale(1.02);
      border-color:rgba(255,255,255,.2);
      box-shadow:0 20px 50px rgba(0,0,0,.45);
    }
    .g-item img{
      width:100%;height:100%;object-fit:cover;
      transition:transform .5s ease;
    }
    .g-item:hover img{transform:scale(1.06)}

    .g-label{
      position:absolute;bottom:0;left:0;right:0;
      padding:2.2rem .85rem .75rem;
      background:linear-gradient(to top,rgba(0,0,0,.72) 0%,transparent 100%);
      font-size:.76rem;font-weight:400;color:rgba(255,255,255,.88);
      opacity:0;transform:translateY(6px);
      transition:all .3s ease;
    }
    .g-item:hover .g-label{opacity:1;transform:translateY(0)}
    .g-tag{
      position:absolute;top:.65rem;left:.65rem;
      border-radius:9999px;padding:.2rem .6rem;
      font-size:.65rem;font-weight:500;
      background:rgba(0,0,0,.45);backdrop-filter:blur(8px);
      color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.1);
    }

    /* ---------- Lightbox ---------- */
    .lb-overlay{
      position:fixed;inset:0;z-index:999;
      background:rgba(0,0,0,.92);backdrop-filter:blur(16px);
      display:flex;align-items:center;justify-content:center;
      opacity:0;pointer-events:none;transition:opacity .3s ease;
    }
    .lb-overlay.show{opacity:1;pointer-events:auto}
    .lb-box{
      max-width:90vw;max-height:85vh;position:relative;
      animation:lbIn .3s ease both;
    }
    @keyframes lbIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    .lb-box img{
      max-width:90vw;max-height:85vh;
      border-radius:.75rem;object-fit:contain;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
    }
    .lb-close{
      position:absolute;top:-2.5rem;right:0;
      width:2.2rem;height:2.2rem;border-radius:9999px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:rgba(255,255,255,.7);
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
      transition:all .2s ease;
    }
    .lb-close:hover{background:rgba(255,255,255,.18);color:#fff}
    .lb-info{
      text-align:center;margin-top:.85rem;
      font-size:.88rem;font-weight:400;color:rgba(255,255,255,.75);
    }
    .lb-nav{
      position:absolute;top:50%;transform:translateY(-50%);
      width:2.6rem;height:2.6rem;border-radius:9999px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:rgba(255,255,255,.7);
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
      transition:all .2s ease;
    }
    .lb-nav:hover{background:rgba(255,255,255,.18);color:#fff}
    .lb-prev{left:-3.75rem}
    .lb-next{right:-3.75rem}
    @media(max-width:800px){
      .lb-prev{left:.75rem}
      .lb-next{right:.75rem}
    }

    /* ---------- Empty state ---------- */
    .empty{
      grid-column:1/-1;text-align:center;padding:4rem 0;
      font-size:.9rem;font-weight:300;color:rgba(255,255,255,.4);
    }

    /* ---------- Footer ---------- */
    .footer{
      border-top:1px solid rgba(255,255,255,.08);
      padding:2rem 0;text-align:center;
      font-size:.75rem;font-weight:300;color:rgba(255,255,255,.35);
    }
  </style>
</head>

  <script>
    (function(){
      var items=document.querySelectorAll('.g-item');
      var visibleItems=[];
      var curIdx=-1;

      // --- Filter ---
      document.getElementById('filters').addEventListener('click',function(e){
        if(!e.target.classList.contains('tab'))return;
        document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
        e.target.classList.add('active');
        var cat=e.target.dataset.cat;
        var has=false;
        items.forEach(function(it){
          var show=cat==='all'||it.dataset.cat===cat;
          it.style.display=show?'':'none';
          if(show)has=true;
        });
        document.getElementById('empty').style.display=has?'none':'';
        // rebuild visible list
        visibleItems=[];
        items.forEach(function(it){if(it.style.display!=='none')visibleItems.push(it)});
      });
      // init visible
      items.forEach(function(it){visibleItems.push(it)});

      // --- Lightbox ---
      window.openLb=function(el){
        curIdx=visibleItems.indexOf(el);
        showAt(curIdx);
        document.getElementById('lightbox').classList.add('show');
        document.body.style.overflow='hidden';
      };
      window.closeLb=function(e){
        if(e&&e.target!==e.currentTarget&&e.type==='click')return;
        document.getElementById('lightbox').classList.remove('show');
        document.body.style.overflow='';
        curIdx=-1;
      };
      window.navLb=function(dir){
        if(curIdx<0)return;
        curIdx=(curIdx+dir+visibleItems.length)%visibleItems.length;
        showAt(curIdx);
      };
      function showAt(i){
        var item=visibleItems[i];
        if(!item)return;
        var img=item.querySelector('img');
        var cap=item.querySelector('.g-label');
        document.getElementById('lbImg').src=img.src;
        document.getElementById('lbImg').alt=img.alt;
        document.getElementById('lbInfo').textContent=cap?cap.textContent:'';
      }

      // Keyboard
      document.addEventListener('keydown',function(e){
        var lb=document.getElementById('lightbox');
        if(!lb.classList.contains('show'))return;
        if(e.key==='Escape')closeLb();
        if(e.key==='ArrowLeft')navLb(-1);
        if(e.key==='ArrowRight')navLb(1);
      });
    })();
  </script>
