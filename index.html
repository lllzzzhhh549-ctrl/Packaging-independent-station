<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Heidelberg Packaging Solutions
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="
https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<script src="
https://cdn.tailwindcss.com">
</script>


<style>

*{
font-family:Inter,sans-serif;
}


body{
margin:0;
}


.liquid-glass{

background:
rgba(255,255,255,.03);

backdrop-filter:
blur(8px);

-webkit-backdrop-filter:
blur(8px);


box-shadow:
inset 0 1px 1px rgba(255,255,255,.15);

position:relative;

overflow:hidden;

}



.liquid-glass:before{

content:"";

position:absolute;

inset:0;

padding:1px;

border-radius:inherit;


background:
linear-gradient(
180deg,
rgba(255,255,255,.6),
transparent,
rgba(255,255,255,.3)
);


-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);


-webkit-mask-composite:xor;

pointer-events:none;

}


</style>

</head>



<body>


<div id="root"></div>


<script src="
https://unpkg.com/react@18/umd/react.development.js">
</script>


<script src="
https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>


<script src="
https://unpkg.com/@babel/standalone/babel.min.js">
</script>



<script type="text/babel">



const {useState}=React;



function UserIcon(){

return (

<svg
width="22"
height="22"
viewBox="0 0 24 24"
fill="none"
stroke="white"
strokeWidth="1.5"
>

<circle cx="12" cy="8" r="4"/>

<path d="
M4 21
c0-4 4-6 8-6s8 2 8 6
"/>

</svg>

)

}



function MenuIcon(){

return(

<svg
width="22"
height="22"
stroke="white"
strokeWidth="2"
>

<line x1="3" y1="7" x2="21" y2="7"/>

<line x1="3" y1="12" x2="21" y2="12"/>

<line x1="3" y1="17" x2="21" y2="17"/>

</svg>

)

}




function Logo(){

return(

<div className="
text-2xl
font-semibold
tracking-tight
">

HP

</div>

)

}




function App(){


const [open,setOpen]=useState(false);


return(

<div className="
h-screen
relative
overflow-hidden
text-white
">


<video

autoPlay
loop
muted
playsInline

className="
absolute
inset-0
w-full
h-full
object-cover
"


src="
https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260715_082433_69699cf8-444b-4484-93cc-053e57896dfd.mp4
"

/>



<div className="
absolute
inset-0
bg-black/50
"/>





<header className="
absolute
top-0
left-0
right-0
z-20

flex
justify-between
items-center

px-6
pt-8

md:px-20
">


<Logo/>




<nav className="
hidden
md:flex

liquid-glass

rounded-full

px-10
py-3

gap-8

text-sm

">


<span>
Home
</span>


<span className="text-white/70">
Packaging Solutions
</span>


<span className="text-white/70">
Technology
</span>


<span className="text-white/70">
Factory
</span>


</nav>



<div className="
hidden
md:flex

liquid-glass

w-10
h-10

rounded-full

items-center
justify-center

">


<UserIcon/>


</div>




<button

onClick={()=>setOpen(!open)}

className="
md:hidden

liquid-glass

w-10
h-10

rounded-full

flex
items-center
justify-center
"

>

<MenuIcon/>


</button>



</header>





<main className="
relative
z-10

h-full

flex
flex-col
justify-between

px-6
md:px-20

pt-40
pb-10

">


<section>


<div className="
liquid-glass

inline-flex

rounded-full

px-4
py-2

mb-6

text-sm
">

Global Packaging Manufacturer

</div>



<h1 className="
text-5xl
md:text-7xl

leading-tight

font-normal

tracking-tight
">


Premium Packaging

<br/>

Made To Impress


</h1>



<p className="
mt-6

max-w-xl

text-white/70

text-lg

font-light
">

Luxury boxes, cosmetic packaging and custom printed cartons.

Powered by Heidelberg printing technology.

</p>




<button className="
liquid-glass

rounded-full

px-8
py-4

mt-8

text-sm

">

Request A Quote

</button>



</section>





<section className="
flex
gap-16
">


<div>

<div className="
text-4xl
">

20+

</div>

<div className="
text-white/60
">

Years Experience

</div>


</div>



<div>


<div className="
text-4xl
">

50+

</div>


<div className="
text-white/60
">

Countries Exported

</div>


</div>


</section>


</main>





</div>


)

}



ReactDOM
.createRoot(
document.getElementById("root")
)
.render(<App/>);



</script>


</body>

</html>
